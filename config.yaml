# Models listed here are the boot defaults. Add or change other models in the
# admin UI (store_model_in_db), which needs no redeploy.
model_list:
  # model_name must match what apps request (Metaphysics AI_AGENT_MODEL)
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  # Staging shares staging-shared Postgres with other apps; keep connections low.
  database_connection_pool_limit: 3
  maximum_spend_logs_retention_period: "30d"
  store_prompts_in_spend_logs: false
  # Explicit so LiteLLM never silently falls back to per-pod rate limits.
  # An unreachable Redis does not stop boot or readiness; its errors show in
  # the logs, so alert on them. REDIS_DB is read from the env.
  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

# No litellm_settings.cache: the response cache stays off. On the shared Redis
# its flush endpoint would run FLUSHALL across every app's databases.
