version: 2.1

orbs:
  hokusai: artsy/hokusai@volatile

not_staging_or_release: &not_staging_or_release
  filters:
    branches:
      ignore:
        - staging
        - release

only_main: &only_main
  context: hokusai
  filters:
    branches:
      only: main

workflows:
  build-deploy:
    jobs:
      - hokusai/test:
          <<: *not_staging_or_release

      - hokusai/push:
          name: push-staging-image
          <<: *only_main
          requires:
            - hokusai/test

      - hokusai/deploy-staging:
          <<: *only_main
          project-name: artsy-litellm
          requires:
            - push-staging-image
